# Copie este arquivo para config/databases.yml e ajuste para o seu ambiente.
#
# Cada banco em `databases:` é 100% independente — sem seção "defaults"
# compartilhada, sem "remotes" nomeados reutilizados entre bancos, e sem
# indireção via .env/variável de ambiente. Todo valor (senha, chave de API,
# token, URL) fica escrito direto aqui, campo a campo, por banco. Esse
# arquivo real (config/databases.yml) fica de fora do git (.gitignore) — é
# ele que guarda os segredos agora, não um .env separado. Recomendado rodar
# `chmod 600 config/databases.yml` no host, já que ele carrega credenciais
# em texto puro.
#
# ------------------------------------------------------------------------
# REFERÊNCIA RÁPIDA — todo campo que existe, por seção. "*" = obrigatório.
# Detalhes/exemplos de cada um estão nos 3 bancos abaixo e no README.md.
# ------------------------------------------------------------------------
#
# databases[]:
#   id*             identificador único (usado em backup.sh/restore.sh/resend.sh/verify.sh <id>)
#   enabled         true|false                         default: true
#   schedule        cron de 5 campos                   default: "0 3 * * *"
#   format          custom|plain                       default: custom  ("directory" não é suportado)
#   connection*:
#     host*, database*, password*
#     port          default: 5432
#     user          default: postgres
#   retention:
#     local_days    dias no staging /backups           default: 7
#     remote_days   dias em cada destino                default: 30
#   verify:
#     structural_check        default: true
#     checksum                 default: true
#     verify_upload             default: true
#     checksum_after_upload      default: false  (opt-in)
#     test_restore                default: false  (opt-in, exige CREATEDB)
#   destinations*:  (lista, pelo menos 1 item)
#     name*, type*: s3|r2|oci_par|local
#     # type: s3 ou r2
#       access_key_id*, secret_access_key*, bucket*
#       provider, region, endpoint, prefix
#     # type: oci_par
#       par_url*
#     # type: local
#       path*
#   notifications:  (lista, opcional — sem ela, esse banco não notifica nada)
#     name          só rótulo nos logs                  default: o próprio "type"
#     on            [start, success, warning, failure]  default: [failure]
#     type*: webhook|telegram|email|ntfy
#     # type: webhook
#       url*
#       format: slack|discord|generic                   default: slack
#     # type: telegram
#       bot_token*, chat_id*
#     # type: email
#       smtp_host*, smtp_user*, smtp_password*, from*, to*
#       smtp_port                                        default: 587 (STARTTLS)
#     # type: ntfy
#       url*
#       priority: min|low|default|high|urgent
# ------------------------------------------------------------------------
#
# EXEMPLOS PRONTOS DE NOTIFICAÇÃO — cole o bloco do tipo que quiser dentro de
# `notifications:` de qualquer banco (troque os valores de exemplo pelos reais):
#
#   - type: telegram
#     name: telegram-oncall
#     bot_token: "123456789:AAAbotTokenDeExemploAqui"   # via @BotFather (t.me/BotFather)
#     chat_id: "-1001234567890"                          # ID do usuário/grupo/canal que recebe
#     on: [failure, warning]
#
#   - type: email
#     smtp_host: smtp.seuservidor.com
#     smtp_port: 587                       # opcional, default 587 (STARTTLS)
#     smtp_user: "backups@seudominio.com"
#     smtp_password: "SUA_SENHA_SMTP"
#     from: "backups@seudominio.com"
#     to: "oncall@seudominio.com"           # pode ser mais de um endereço, separado por vírgula
#     on: [failure, warning]
# ------------------------------------------------------------------------

databases:
  # 1) MÍNIMO POSSÍVEL — só os campos realmente obrigatórios; o resto usa o
  #    valor padrão do próprio script (documentado na tabela do README).
  #    Um único destino na nuvem, SEM nenhuma cópia local extra (só o
  #    staging temporário em /backups, que sempre existe).
  - id: app-simples
    schedule: "0 3 * * *"
    connection:
      host: app-simples-postgres   # nome do container/serviço na network Docker compartilhada
      database: app_simples
      password: "TROQUE-ESTA-SENHA"
    destinations:
      - name: r2-principal
        type: r2
        provider: Cloudflare
        endpoint: "https://SEU_ACCOUNT_ID.r2.cloudflarestorage.com"
        access_key_id: "SUA_R2_ACCESS_KEY_ID"
        secret_access_key: "SUA_R2_SECRET_ACCESS_KEY"
        bucket: app-simples-backups
        prefix: app-simples/
    notifications:
      - type: webhook
        format: slack
        url: "https://hooks.slack.com/services/SEU/WEBHOOK/AQUI"
        on: [failure]

  # 2) "CINTO E SUSPENSÓRIOS" — todo campo explícito, verificação máxima
  #    (inclusive as duas opt-in: checksum_after_upload e test_restore), e
  #    backup replicado nos QUATRO tipos de destino ao mesmo tempo
  #    (S3 + R2 + OCI PAR + disco local) — pro banco mais crítico do fluxo.
  #    Cada destino carrega sua própria credencial, sem nenhum "remote"
  #    compartilhado com outro banco.
  - id: app-critico
    enabled: true
    schedule: "15 2 * * *"          # horário diferente de app-simples, de propósito (evita disparo simultâneo)
    format: custom                   # custom (pg_dump -Fc) | plain (-Fp) — "directory" (-Fd) ainda não é suportado
    connection:
      host: app-critico-postgres
      port: 5432
      user: postgres
      database: app_critico
      password: "TROQUE-ESTA-SENHA-TAMBEM"
    retention:
      local_days: 14
      remote_days: 90
    verify:
      structural_check: true
      checksum: true
      verify_upload: true
      checksum_after_upload: true    # confere MD5 real via ETag/content-md5 em cada destino
      test_restore: true              # restore de teste completo a cada backup (exige CREATEDB)
    destinations:
      - name: s3-principal
        type: s3
        provider: AWS
        region: us-east-1
        access_key_id: "SUA_AWS_ACCESS_KEY_ID"
        secret_access_key: "SUA_AWS_SECRET_ACCESS_KEY"
        bucket: app-critico-backups-primario
        prefix: app-critico/
      - name: r2-secundario
        type: r2
        provider: Cloudflare
        endpoint: "https://SEU_ACCOUNT_ID.r2.cloudflarestorage.com"
        access_key_id: "SUA_R2_ACCESS_KEY_ID"
        secret_access_key: "SUA_R2_SECRET_ACCESS_KEY"
        bucket: app-critico-backups-secundario
        prefix: app-critico/
      - name: oci-arquivo-frio
        type: oci_par
        par_url: "https://objectstorage.SUA-REGIAO.oraclecloud.com/p/SEU-TOKEN-DA-PAR/n/SEU-NAMESPACE/b/SEU-BUCKET/o"
      - name: disco-secundario
        type: local
        path: /mnt/backup-secundario/app-critico/   # precisa estar montado como volume no compose
    notifications:
      - type: telegram
        name: telegram-oncall
        bot_token: "123456789:AAAbotTokenDeExemploAqui"
        chat_id: "-1001234567890"
        on: [start, success, warning, failure]
      - type: email
        smtp_host: smtp.seuservidor.com
        smtp_port: 587                 # opcional, default 587 (STARTTLS)
        smtp_user: "backups@seudominio.com"
        smtp_password: "SUA_SENHA_SMTP"
        from: "backups@seudominio.com"
        to: "oncall@seudominio.com"
        on: [failure, warning]
      - type: webhook
        format: discord
        url: "https://discord.com/api/webhooks/SEU/WEBHOOK/AQUI"
        on: [failure]

  # 3) PROJETO PAUSADO/LEGADO — format: plain, enabled: false (fora do
  #    crontab automático, mas ainda dá pra rodar `backup.sh app-legado` na
  #    mão), único destino, e é do tipo "local" — o oposto do exemplo 1 (que
  #    não tinha nenhum "local"). Notificação mínima: só um ntfy avisando
  #    falha, já que ninguém acompanha de perto.
  - id: app-legado
    enabled: false
    schedule: "0 4 * * *"
    format: plain
    connection:
      host: app-legado-postgres
      database: app_legado
      password: "TROQUE-ESTA-SENHA-TAMBEM-2"
    destinations:
      - name: disco-secundario
        type: local
        path: /mnt/backup-secundario/app-legado/
    notifications:
      - type: ntfy
        url: "https://ntfy.sh/SEU-TOPICO-PRIVADO-E-DIFICIL-DE-ADIVINHAR"
        priority: default                # min | low | default | high | urgent
        on: [failure]
